title: Onyxia Presentation (dark theme)
author: Romain Lesur
version: 1.1.0
contributes:
  formats:
    revealjs:
      filters: [bg.lua]
      theme:
        - default
        - onyxia-dark.scss
      css: [logo.css]
      title-slide-attributes:
        data-background-image: background-dark.svg
        data-background-size: contain
      header-includes: |
        <link rel="icon" type="image/svg" href="logo.svg">
      email-obfuscation: javascript
      format-resources:
        - logo.svg
        - background-dark.svg
